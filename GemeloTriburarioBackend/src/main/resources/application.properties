spring.application.name=GemeloTriburarioBackend

# Base de datos (MySQL / XAMPP local) — misma base que usas en phpMyAdmin
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/gemelotributariobase?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate — crea/actualiza las 18 tablas solo, a partir de los modelos
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

server.port=${PORT:8080}

# Fotos de perfil — se guardan en disco, en la carpeta ./uploads/perfil
app.upload.dir=uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Swagger — UI en /swagger-ui.html, JSON en /v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs